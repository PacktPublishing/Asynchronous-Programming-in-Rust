services:
  delayserver:
    build: ../../delayserver/
    ports:
      - "8080:8080"
    command: ["cargo", "run", "--", "0.0.0.0"]

  epoll:
    build: .
    depends_on:
      - delayserver
    command: >
        sh -c "echo 'Waiting for delayserver...' && sleep 2 && cargo run --release"
    network_mode: "service:delayserver"